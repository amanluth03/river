[project]
name = "apex-benchmark"
version = "0.1.0"
description = "Apex Ridge competitor benchmarking from SEC EDGAR filings, with verified citations"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "lxml>=5.3",
    "pydantic>=2.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
    "python-docx>=1.2.0",
]

[project.scripts]
benchmark = "benchmark.app:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`:DeprecationWarning"]
